# Materials science gate router for nature-materials-science-reviewer-skill-v1.0
version: v1.0
claim_types:
  novel_material_or_general_advance_claim:
    gate: editorial_significance_and_novelty
    evidence_risk: "The manuscript presents an advance without distinguishing it from closest prior materials, mechanisms, or devices."
    reviewer_concern: "Reviewers may see the contribution as incremental, insufficiently positioned, or too narrow for Nature-level scope."
    revision_direction: "State the exact advance over closest work, quantify the improvement, and align the claimed scope with the evidence."
  synthesis_or_processing_claim:
    gate: synthesis_route_and_reproducibility
    evidence_risk: "The target material may not be reproducibly accessible from the described route or processing window."
    reviewer_concern: "Reviewers ask for complete synthesis details, batch-to-batch consistency, process windows, yields, and failure cases."
    revision_direction: "Add full protocols, key parameters, replicate batches, yield/throughput information, and limits of the synthesis route."
  material_identity_or_phase_claim:
    gate: composition_phase_purity_and_identity
    evidence_risk: "The claimed material identity may be confounded by impurity phases, mixed composition, solvent, dopants, or incomplete assignment."
    reviewer_concern: "Reviewers ask whether the observed properties arise from the stated phase and composition."
    revision_direction: "Provide orthogonal compositional and phase evidence, quantify purity, assign phases, and rule out likely impurities."
  structure_or_morphology_claim:
    gate: structural_characterization_and_spatial_evidence
    evidence_risk: "Structural, morphological, or interfacial claims may be under-supported by limited or non-representative characterization."
    reviewer_concern: "Reviewers request higher-resolution, more representative, or orthogonal structural evidence."
    revision_direction: "Add complementary microscopy/spectroscopy/diffraction, representative sampling, image quantification, and clear assignment of features."
  material_property_or_performance_claim:
    gate: property_measurement_and_metric_validity
    evidence_risk: "The selected metric, measurement protocol, or unit normalization may not support the claimed performance."
    reviewer_concern: "Reviewers challenge sensitivity, capacity, modulus, conductivity, efficiency, adsorption, or other property measurements."
    revision_direction: "Define protocols, justify metrics, normalize consistently, add controls, and report uncertainty and replicate statistics."
  superiority_or_comparison_claim:
    gate: control_materials_and_benchmarking
    evidence_risk: "The comparison set may be incomplete, unfair, outdated, or not measured under equivalent conditions."
    reviewer_concern: "Reviewers ask for state-of-the-art controls, commercial comparators, or identical testing conditions."
    revision_direction: "Benchmark against closest materials and devices using matched protocols, transparent baselines, and literature context."
  mechanistic_or_structure_property_claim:
    gate: structure_property_causality_and_mechanism
    evidence_risk: "A correlation between structure and performance is presented as a causal mechanism."
    reviewer_concern: "Reviewers ask for perturbation, control, in situ, operando, or alternative-mechanism tests."
    revision_direction: "Separate correlation from causality, add targeted controls, validate proposed pathways, and discuss plausible alternatives."
  stability_or_long_term_utility_claim:
    gate: stability_durability_and_operando_relevance
    evidence_risk: "Short-term or ideal-condition tests may not support claims of durability, stability, cycling, or operational robustness."
    reviewer_concern: "Reviewers request long-term tests, environmental stressors, cycling, degradation analysis, and post-test characterization."
    revision_direction: "Add durability protocols, stress conditions, failure analysis, before/after characterization, and realistic use-condition tests."
  application_or_translation_claim:
    gate: scalability_processability_and_application_boundary
    evidence_risk: "Proof-of-concept results may be overextended to manufacturability, device deployment, or industrial relevance."
    reviewer_concern: "Reviewers ask for scale, processability, throughput, cost, integration, or realistic operating constraints."
    revision_direction: "State the application boundary, add scale/process evidence where available, and avoid industrial claims not directly tested."
  computational_prediction_or_design_claim:
    gate: computational_design_and_model_validation
    evidence_risk: "A model, simulation, DFT calculation, or machine-learning design may not be sufficiently validated experimentally or out of distribution."
    reviewer_concern: "Reviewers ask for assumptions, convergence, descriptors, training/test split, ablations, external validation, and uncertainty."
    revision_direction: "Report model settings, validation strategy, failure modes, uncertainty, and experimental confirmation of key predictions."
  quantitative_difference_or_generalization_claim:
    gate: statistical_inference_uncertainty_and_replicates
    evidence_risk: "Quantitative differences may be based on too few replicates, unclear statistics, or unreported uncertainty."
    reviewer_concern: "Reviewers request replicate counts, error bars, significance tests, variance, and sample representativeness."
    revision_direction: "Report n, independent repeats, uncertainty intervals, statistical tests, and criteria for excluding measurements."
  reproducibility_or_reporting_claim:
    gate: data_code_materials_and_reporting_completeness
    evidence_risk: "Methods, figures, data, units, source data, code, or materials availability are insufficient for verification or reuse."
    reviewer_concern: "Reviewers flag missing methodological details, inconsistent figure labels, inaccessible data/code, or ambiguous definitions."
    revision_direction: "Complete methods, units, captions, data/code availability, materials provenance, and figure-level consistency checks."
  presentation_or_cross_field_accessibility_claim:
    gate: reader_logic_and_figure_narrative
    evidence_risk: "A complex materials story may be hard to follow or may ask readers to infer the evidence chain from scattered figures."
    reviewer_concern: "Reviewers ask for clearer definitions, schematic logic, figure sequencing, and separation of major and minor claims."
    revision_direction: "Clarify the central claim, define terms early, align figures with claims, and move secondary details to supplement if needed."
