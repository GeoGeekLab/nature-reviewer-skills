name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e .
      - run: python scripts/sync_skill_assets.py
      - run: python scripts/validate_all.py
      - run: python -m pytest --cov=nature_reviewer_core --cov-report=term-missing
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/nature_reviewer_core
      - run: bandit -q -r src scripts
      - run: python scripts/run_benchmarks.py benchmarks/cases benchmarks/predictions/example_predictions.jsonl
      - if: matrix.python-version == '3.12'
        run: python scripts/validate_benchmark_suite.py benchmarks/controlled_v1/cases.jsonl
      - if: matrix.python-version == '3.12'
        run: python scripts/run_benchmarks.py benchmarks/controlled_v1/cases.jsonl benchmarks/controlled_v1/oracle_predictions.jsonl
      - if: matrix.python-version == '3.12'
        run: python scripts/prepare_blinded_pilot.py --model-id ci-harness-selftest --output .pilot_ci
      - if: matrix.python-version == '3.12'
        run: python scripts/validate_pilot_packets.py .pilot_ci
      - if: matrix.python-version == '3.12'
        run: python scripts/selftest_pilot_harness.py .pilot_ci

  package-matrix:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        skill:
          - nature-chemistry-reviewer-skill
          - nature-engineering-reviewer-skill
          - nature-materials-science-reviewer-skill
          - nature-earth-system-reviewer-skills/skills/nature-atmospheric-science-reviewer-skill
          - nature-earth-system-reviewer-skills/skills/nature-climate-ecology-reviewer-skill
          - nature-earth-system-reviewer-skills/skills/nature-hydrology-reviewer-skill
          - nature-earth-system-reviewer-skills/skills/nature-remote-sensing-reviewer-skill
          - nature-earth-system-reviewer-skills/skills/polar-earth-system-review-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e .
      - run: python scripts/sync_skill_assets.py
      - run: python "${{ matrix.skill }}/scripts/validate_package.py" --root "${{ matrix.skill }}"
      - run: python -m pytest "${{ matrix.skill }}/tests"
