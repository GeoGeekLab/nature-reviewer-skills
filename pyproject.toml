[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nature-reviewer-core"
version = "2.2.0"
description = "Shared validation, retrieval, extraction, and evaluation runtime for Nature Reviewer Skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GeoGeekLab contributors and reliability refactor"}]
dependencies = []

[project.optional-dependencies]
documents = [
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "defusedxml==0.7.1",
]
dev = [
  "bandit==1.8.2",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.4",
]

[project.scripts]
nature-reviewer-validate = "nature_reviewer_core.cli:validate_main"
nature-reviewer-search = "nature_reviewer_core.cli:search_main"
nature-reviewer-evaluate = "nature_reviewer_core.cli:evaluate_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nature_reviewer_core"]
