name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate skill package
        run: python scripts/validate_package.py .

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Bandit security check
        run: python -m bandit -q -r scripts

      - name: DOCX render smoke test
        run: |
          mkdir -p outputs
          python scripts/render_review_docx.py examples/example_review_report.md outputs/example_review_report.docx
