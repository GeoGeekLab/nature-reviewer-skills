[project]
name = "nature-earth-system-reviewer-skills"
version = "1.0.1"
description = "Umbrella repository for independent Earth-system Nature reviewer skills."
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]
ignore = ["E501"]
